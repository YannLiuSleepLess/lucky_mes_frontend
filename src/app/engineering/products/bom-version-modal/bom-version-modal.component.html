<div class="modal-header">
  <h5 class="modal-title">{{ versionId ? '编辑BOM版本' : '新增BOM版本' }}</h5>
  <button type="button" class="close" (click)="close()">
    <span aria-hidden="true">&times;</span>
  </button>
</div>

<div class="modal-body">
  <form [formGroup]="form" (ngSubmit)="submitForm()">
    <div class="row">
      <div class="col-md-6">
        <div class="form-group">
          <label for="versionNo">版本号</label>
          <input type="text" id="versionNo" class="form-control" formControlName="versionNo" />
          <span *ngIf="form.get('versionNo').invalid && form.get('versionNo').touched" class="text-danger">
            版本号是必填项
          </span>
        </div>
      </div>
      <div class="col-md-6">
        <div class="form-group">
          <label for="bomType">BOM类型</label>
          <select id="bomType" class="form-control" formControlName="bomType">
            <option *ngFor="let type of bomTypeOptions; trackBy: trackByOptionValue" [ngValue]="type.value">{{ type.key }}</option>
          </select>
        </div>
      </div>
    </div>

    <div class="row">
      <div class="col-md-12">
        <div class="form-group">
          <label for="changeReason">变更原因</label>
          <textarea id="changeReason" class="form-control" formControlName="changeReason" rows="3"></textarea>
        </div>
      </div>
    </div>

    <div class="form-group">
      <label class="d-block">
        <input type="checkbox" formControlName="isActive" />
        设为生效版本
      </label>
    </div>

    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" (click)="close()">取消</button>
      <button type="submit" class="btn btn-primary" [disabled]="form.invalid || isSubmitting">
        <i *ngIf="isSubmitting" class="fa fa-spinner fa-spin mr-1"></i>
        {{ isSubmitting ? '保存中...' : '保存' }}
      </button>
    </div>
  </form>
</div>
