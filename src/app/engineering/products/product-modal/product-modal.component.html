<div class="modal-header">
  <h5 class="modal-title">{{ isEditing ? '编辑产品' : '添加产品' }}</h5>
  <button type="button" class="close" (click)="close()">
    <span aria-hidden="true">&times;</span>
  </button>
</div>

<form [formGroup]="form" (ngSubmit)="submitForm()">
  <div class="modal-body">
    <div class="row">
      <div class="col-md-6">
        <div class="form-group">
          <label for="productCode">产品编码</label>
          <input
            type="text"
            id="productCode"
            class="form-control"
            formControlName="productCode"
            [readonly]="isEditing"
          />
          <span *ngIf="form.get('productCode').invalid && form.get('productCode').touched" class="text-danger">
            产品编码是必填项
          </span>
        </div>
      </div>
      <div class="col-md-6">
        <div class="form-group">
          <label for="productName">产品名称</label>
          <input
            type="text"
            id="productName"
            class="form-control"
            formControlName="productName"
          />
          <span *ngIf="form.get('productName').invalid && form.get('productName').touched" class="text-danger">
            产品名称是必填项
          </span>
        </div>
      </div>
    </div>

    <div class="row">
      <div class="col-md-6">
        <div class="form-group">
          <label for="type">产品类型</label>
          <select id="type" class="form-control" formControlName="type">
            <option *ngFor="let type of productTypeOptions" [ngValue]="type.value">
              {{ type.key }}
            </option>
          </select>
        </div>
      </div>
      <div class="col-md-6">
        <div class="form-group">
          <label for="unit">单位</label>
          <input type="text" id="unit" class="form-control" formControlName="unit" />
        </div>
      </div>
    </div>

    <div class="row">
      <div class="col-md-6">
        <div class="form-group">
          <label for="material">材质</label>
          <input type="text" id="material" class="form-control" formControlName="material" />
        </div>
      </div>
      <div class="col-md-6" *ngIf="isEditing">
        <div class="form-group">
          <label class="d-block">
            <input type="checkbox" formControlName="isActive" />
            启用状态
          </label>
        </div>
      </div>
    </div>

    <div class="card mt-3">
      <div class="card-header">规格参数</div>
      <div class="card-body" formGroupName="specification">
        <div class="row">
          <div class="col-md-4">
            <div class="form-group">
              <label for="length">长度</label>
              <input type="number" id="length" class="form-control" formControlName="length" />
            </div>
          </div>
          <div class="col-md-4">
            <div class="form-group">
              <label for="width">宽度</label>
              <input type="number" id="width" class="form-control" formControlName="width" />
            </div>
          </div>
          <div class="col-md-4">
            <div class="form-group">
              <label for="height">高度</label>
              <input type="number" id="height" class="form-control" formControlName="height" />
            </div>
          </div>
        </div>
        <div class="row">
          <div class="col-md-4">
            <div class="form-group">
              <label for="thickness">厚度</label>
              <input type="number" id="thickness" class="form-control" formControlName="thickness" />
            </div>
          </div>
          <div class="col-md-4">
            <div class="form-group">
              <label for="weight">重量</label>
              <input type="number" id="weight" class="form-control" formControlName="weight" />
            </div>
          </div>
          <div class="col-md-4">
          </div>
        </div>
        <div class="row">
          <div class="col-md-12">
            <div class="form-group">
              <label for="customSpecs">自定义规格</label>
              <textarea id="customSpecs" class="form-control" formControlName="customSpecs" rows="2"></textarea>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-footer">
    <button type="button" class="btn btn-secondary" (click)="close()">
      取消
    </button>
    <button type="submit" class="btn btn-primary" [disabled]="form.invalid || isSubmitting">
      <i *ngIf="isSubmitting" class="fa fa-spinner fa-spin mr-1"></i>
      {{ isSubmitting ? '保存中...' : '保存' }}
    </button>
  </div>
</form>
